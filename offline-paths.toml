version = 1

# Each entry declares the smallest representative path that can run without an
# API key or external service after dependency installation. Commands are argv
# arrays, never shell strings. The verifier requires exact coverage of .gitmodules.

[[repositories]]
path = "mcp-deep-dive"
runtime = "python"
python = "3.11"
claim = "Render protocol messages without a model, server, key, or network."
commands = [["python", "examples/01_protocol.py"]]

[[repositories]]
path = "agent-harness-deep-dive"
runtime = "python"
python = "3.11"
claim = "Validate the deterministic mock harness and its offline capstone."
install = [["python", "-m", "pip", "install", "-r", "requirements.txt"]]
commands = [["python", "check_setup.py"]]
environment = { PROVIDER = "mock", NO_COLOR = "1" }


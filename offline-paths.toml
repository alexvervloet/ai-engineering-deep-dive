[[repositories]]
path = "ml-foundations-for-ai-engineers"
runtime = "python"
python = "3.12"
claim = "Run all model mechanics and the tiny transformer lab on CPU without an API key."
install = [
  ["python", "-m", "pip", "install", "numpy==2.5.2"],
  ["python", "-m", "pip", "install", "torch==2.13.0", "--index-url", "https://download.pytorch.org/whl/cpu"],
  ["python", "-m", "pip", "install", "-e", ".", "--no-deps"],
]
# tests/ is not a package, so discovery needs an explicit start directory. A bare
# `unittest discover` finds zero tests here and still exits zero.
commands = [
  ["python", "check_setup.py"],
  ["python", "-m", "unittest", "discover", "-s", "tests", "-v"],
]


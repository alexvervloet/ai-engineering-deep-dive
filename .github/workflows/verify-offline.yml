name: Verify offline paths

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Validate submodule inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Require one declared path per submodule
        run: python scripts/verify_offline.py --validate

      - name: Check every relative markdown link resolves
        run: python scripts/verify_links.py

      - name: Check every path named in prose resolves
        run: python scripts/verify_paths.py

      - name: Build isolated job matrix
        id: matrix
        shell: bash
        run: echo "value=$(python scripts/verify_offline.py --matrix)" >> "$GITHUB_OUTPUT"

  offline-path:
    name: ${{ matrix.path }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        if: matrix.runtime == 'python'
        with:
          python-version: ${{ matrix.version }}

      - uses: actions/setup-node@v7
        if: matrix.runtime == 'node'
        with:
          node-version: ${{ matrix.version }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install and run declared offline path
        run: python3 scripts/verify_offline.py --repo "${{ matrix.path }}"

# Dependabot watches the workflow actions used by this repo. It does not follow
# submodules, so each dive's requirements.txt is updated in its own repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    # One PR per month for every action, instead of one PR per action. The
    # August 2026 run opened four separate PRs for four version bumps.
    groups:
      github-actions:
        patterns:
          - "*"
